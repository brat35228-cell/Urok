<script>(function(){
// core/setup.js — Рендерер, камера, світло, помічники
const $=s=>document.querySelector(s),T=THREE,PI=Math.PI;
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const scene=new T.Scene();scene.background=new T.Color(0x1b2036);scene.fog=new T.Fog(0x1b2036,13,28);
const cam=new T.PerspectiveCamera(70,1,.1,60);cam.rotation.order="YXZ";cam.position.set(0,1.55,3.7);scene.add(cam);
const ren=new T.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio||1,2));
ren.shadowMap.enabled=true;ren.shadowMap.type=T.PCFSoftShadowMap;$("#game").appendChild(ren.domElement);
function rs(){const w=innerWidth,h=innerHeight;ren.setSize(w,h);cam.aspect=w/h;cam.fov=w<h?92:66;cam.updateProjectionMatrix()}
addEventListener("resize",rs);rs();
document.addEventListener("contextmenu",e=>e.preventDefault());
scene.add(new T.AmbientLight(0xffffff,.7));
const sun=new T.DirectionalLight(0xfff2d6,.85);sun.position.set(-4,8,5);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-9,right:9,top:9,bottom:-9,near:1,far:25});sun.shadow.bias=-.0005;scene.add(sun);
[-4,0,3].forEach(z=>{const l=new T.Mesh(new T.BoxGeometry(3,.06,.5),new T.MeshBasicMaterial({color:0xfff6d8}));l.position.set(0,4.97,z);scene.add(l)});
function mk(w,h,d,c,x,y,z,p){const m=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshLambertMaterial({color:c}));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;(p||scene).add(m);return m}

// utils/feedback.js — Звук, тости, спалахи
let ac;function beep(f,d,ty,v,dl){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+(dl||0);o.type=ty||"square";o.frequency.value=f;g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.001,t+(d||.12));o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+(d||.12))}catch(e){}}
let tto;function toast(m,ms){const e=$("#toast");e.textContent=m;e.style.opacity=1;clearTimeout(tto);tto=setTimeout(()=>e.style.opacity=0,ms||2300)}

// scene/room.js — Кімната, дошка
mk(14,.2,16,0x9b7a55,0,-.1,-1);mk(14,.2,16,0xeeeeee,0,5.1,-1).castShadow=false;
mk(14,5,.2,0xd8e0ee,0,2.5,-9);mk(.2,5,16,0xd8e0ee,-7,2.5,-1);mk(.2,5,16,0xd8e0ee,7,2.5,-1);
[-5,-1,3].forEach(z=>mk(.05,1.7,2,0xbfe6ff,-6.88,2.8,z));
mk(5.4,2.1,.1,0x7a5a3a,0,2.3,-8.88);
const bc=document.createElement("canvas");bc.width=512;bc.height=170;const bx=bc.getContext("2d");
bx.fillStyle="#1f5a43";bx.fillRect(0,0,512,170);bx.fillStyle="#fff";bx.font="bold 34px sans-serif";bx.fillText("Алгебра: квадратні",20,60);bx.fillText("рівняння  x² − 5x + 6",20,110);

function bub(e){
 return bubC[e]||(bubC[e]=(()=>{
  const c=document.createElement("canvas");c.width=c.height=64;
  const x=c.getContext("2d");x.font="46px sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText(e,32,36);
  return new T.SpriteMaterial({map:new T.CanvasTexture(c),transparent:true,depthTest:false});
 })());
}
function studentsUpdate(dt,now){
 const alert=G.run&&["warn","look","p2","p3"].includes(th.m);
 STU.forEach(s=>{
  s.t-=dt;
  if(s.t<=0){
   s.t=rnd(2.5,7);
   const L=G.test?["write","write","look"]:["write","look","whisper","doze","hand","look"];
   s.mood=L[Math.floor(Math.random()*L.length)];
   const e={whisper:Math.random()<.5?"💬":"😂",hand:"🙋",doze:"😴"}[s.mood];
   s.bb.visible=!!e;if(e)s.bb.material=bub(e);
  }
  const m=alert?"sit":s.mood,w=now/1000+s.p;
  if(alert)s.bb.visible=false;
  let hy=0,hx=0,lean=0,ax=0,az=.1;
  if(m==="look")hy=Math.sin(w*.8)*.9;
  if(m==="write"){hx=.35;ax=.9+Math.sin(w*9)*.15}

  s.head.rotation.y+=(hy-s.head.rotation.y)*k;s.head.rotation.x+=(hx-s.head.rotation.x)*k;
  s.g.rotation.z+=(lean-s.g.rotation.z)*k;
  s.arm.rotation.x+=(ax-s.arm.rotation.x)*k;s.arm.rotation.z+=(az-s.arm.rotation.z)*k;
  s.g.position.y=Math.sin(w*1.6)*.01;
 });
}

// scene/desks.js — парти й учні (кожен учень — група з головою, рукою й бульбашкою)

 if(x===0&&z===2.8)return;
 mk(.5,.06,.5,0x4a5578,x,.5,z+.85);mk(.5,.6,.06,0x4a5578,x,.85,z+1.1);
 const col=sc[si++%6],g=new T.Group(),hd=new T.Group(),ap=new T.Group();

 const h=new T.Mesh(new T.SphereGeometry(.2,12,10),new T.MeshLambertMaterial({color:SKIN[si%4]}));

 STU.push({g,head:hd,arm:ap,bb,p:Math.random()*6,t:rnd(.5,4),mood:"write",side:x<0?-1:x>0?1:(Math.random()<.5?-1:1)});
}));
mk(.5,.01,.7,0xffffff,0,.9,2.7);mk(.5,.01,.35,0xfff59d,-2.6,.9,2.6);

// scene/teacher-model.js — вчитель: лисий, суворий, в окулярах і з лінійкою

mk(.6,.95,.4,0x1f6f78,0,1.2,0,tg);
mk(.22,.75,.22,0x4a4f5a,-.14,.38,0,tg);mk(.22,.75,.22,0x4a4f5a,.14,.38,0,tg);

// game/teacher-ai.js — Поведінка вчителя
function turn(a,dt){let d=a-tg.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));tg.rotation.y+=d*Math.min(1,dt*9)}
function walk(tx,tz,dt,sp){const dx=tx-tg.position.x,dz=tz-tg.position.z,d=Math.hypot(dx,dz);if(d<.08)return true;const s=Math.min(d,sp*dt);tg.position.x+=dx/d*s;tg.position.z+=dz/d*s;turn(Math.atan2(dx,dz),dt);tg.position.y=Math.abs(Math.sin(G.time*9))*.05;return false}
const setT=(m,t)=>{th.m=m;th.t=t||0};
const warnT=()=>Math.max(.75,1.45-.06*G.lvl+.12*Math.floor(G.lvl/3));
function updTeacher(dt){
 const sp=2.3+.12*G.lvl,AX=1.3;th.t-=dt;
 switch(th.m){
 case"board":turn(PI,dt);tg.position.y=0;if(th.t<=0&&G.calm<=0){th.next=Math.random()<(G.test?.5:.28)+G.lvl*.02?"patrol":"look";setT("warn",warnT());G.warnUp=G.up||G.hold==="ch";mark.visible=true}break;
 case"warn":turn(0,dt);if(th.t<=0){mark.visible=false;if(G.warnUp&&!G.up&&G.hold!=="ch"){G.combo++;const b=10*Math.min(G.combo,8);G.xp+=b;lvlCheck();toast("😎 Вчасно сховав! Серія "+G.combo+" (+"+b+" XP)",1100);flash("#8b6cff")}th.next==="look"?setT("look",rnd(2.2,3.6)):setT("p1")}break;
 case"look":turn(0,dt);if(th.t<=0)setT("board",Math.max(2.2,rnd(4,7.5)-G.lvl*.3));break;
 case"p1":if(walk(AX,-6.6,dt,sp))setT("p2");break;
 case"p2":if(walk(AX,1.8,dt,sp))setT("p3",2.6);break;
 case"p3":tg.position.y=0;turn(-PI/2,dt);if(th.t<=0)setT("p4");break;
 case"p4":if(walk(AX,-6.6,dt,sp))setT("p5");break;
 case"p5":if(walk(0,-7.3,dt,sp))setT("board",3);break}
}

function endTest(ok){const t=G.test;G.test=null;G.hold=null;ui();
 if(!ok)return end("Не встиг дописати контрольну — двійка 😭");
 const r=t.t/t.tot,g=r>.45?5:r>.2?4:3;G.tests++;G.xp+=150;G.sus*=.5;G.nextTest=G.quick?rnd(55,90):rnd(300,600);beep(660,.15,"triangle",.08);beep(990,.25,"triangle",.08,.15);toast("Контрольна здана! Оцінка: "+g+" 🎉",2800);lvlCheck()}

function end(why){G.run=false;G.up=false;G.hold=null;beep(180,.5,"sawtooth",.08);
 if(G.time>best){best=G.time;try{localStorage.setItem("u8b",String(best))}catch(e){}}

// game/update.js — Оновлення гри кожен кадр
function update(dt){
 if(quizTick(dt))return;G.time+=dt;G.qcd-=dt;G.recess=Math.max(0,G.recess-dt);G.calm=Math.max(0,G.calm-dt);updTeacher(dt);
 const d=G.recess>0?0:DG[th.m],using=G.up&&!G.test,cheat=G.test&&G.hold==="ch",eat=!G.test&&G.hold==="eat";let rate=0;
 if(d>0&&(using||cheat||eat))rate=45*d*(using?APP[G.app].m:eat?1.2:1.5)*Math.pow(.88,G.lvl-1);
 G.sus=clamp(G.sus+(rate>0?rate:-12)*dt,0,100);if(G.sus>70)G.combo=0;G.hunger=clamp(G.hunger+(eat?-26:1.4)*dt,0,100);if(eat)G.xp+=1.5*dt;G.gr-=dt;if(G.hunger>=90&&G.gr<=0){G.gr=5;G.sus=Math.min(99,G.sus+(d>0?25:12));toast("🤤 Живіт бурчить на весь клас!",1200);beep(120,.4,"sawtooth",.08)}if(G.sus>=70&&G.qcd<=0&&!G.quiz&&d>0)return quizStart();
 if(G.sus>=100)return end("Вчитель забрав телефон 📵 і викликає батьків!");
 if(using){const gx=APP[G.app].x*dt*(1+.25*Math.min(G.combo,8))*(G.recess>0?3:1);G.xp+=gx;G.coins+=gx/10;lvlCheck()}
 if(G.test){const t=G.test;t.t-=dt;if(G.hold==="wr")t.p+=1.5*dt;if(G.hold==="ch")t.p+=5*dt;
  if(t.p>=100)endTest(true);else if(t.t<=0)endTest(false)}
 else{G.nextTest-=dt;if(G.nextTest<=0)startTest();G.nextRec-=dt;if(G.nextRec<=0){G.nextRec=G.quick?rnd(40,70):rnd(90,150);G.recess=9;beep(1200,.2,"triangle",.07);beep(1500,.3,"triangle",.07,.2);toast("🔔 ПЕРЕРВА! 9 секунд безпечно, XP ×3!",2400);flash("#38d996")}
  if(!G.calling){G.nextCall-=dt;if(G.nextCall<=0){G.calling=true;G.callT=2.4;$("#call").hidden=false;beep(1000,.1,"square",.06);beep(1000,.1,"square",.06,.2)}}}
 if(G.calling){G.callT-=dt;if(G.callT<=0){G.calling=false;$("#call").hidden=true;G.sus=Math.min(99,G.sus+35);G.nextCall=rnd(40,90);toast("📞 Мама зателефонувала на весь клас!");beep(300,.3,"sawtooth",.08)}}
 hud();
}

  [G.tests>=3,"🎓 Три контрольні"],[G.combo>=3,"🔥 Серія ×3"],

 el.innerHTML=`<div class="dr"><b>📓 Щоденник</b><div>Рівень ${G.lvl} · Контрольних: ${G.tests}</div>`
  +A.map(a=>`<div>${a[0]?"🏅":"🔒"} ${a[1]}</div>`).join("")+"</div>";
}

// ui/controls.js — Кнопки й утримання
$("#tog").onclick=()=>{if(!G.run||G.test)return;G.up=!G.up;if(G.up)G.app=3;ui();beep(500,.05,"triangle",.04)};
$("#call").onclick=()=>{G.calling=false;G.nextCall=rnd(40,90);$("#call").hidden=true;beep(400,.1,"triangle",.05);toast("Відхилено 👍")};
function buy(c,f){if(!G.run||G.coins<c)return;G.coins-=c;f();beep(700,.1,"triangle",.06);hud()}
$("#p1").onclick=()=>{if(G.test)buy(6,()=>{G.test.p=Math.min(100,G.test.p+28);toast("🧠 Шпаргалка: +28%",1200)})};
$("#p2").onclick=()=>buy(8,()=>{G.calm=8;mark.visible=false;if(th.m==="look"||th.m==="warn")setT("board",3);else if(th.m==="p1"||th.m==="p2"||th.m==="p3")setT("p4");toast("😴 Вчителя відволікли на 8 с",1400)});
$("#p3").onclick=()=>buy(5,()=>{G.sus=Math.max(0,G.sus-40);toast("🍫 Заспокоївся: підозра −40",1200)});
function hold(el,n){el.addEventListener("pointerdown",e=>{e.preventDefault();G.hold=n;el.classList.add("on")});
 ["pointerup","pointercancel","pointerleave"].forEach(ev=>el.addEventListener(ev,()=>{if(G.hold===n)G.hold=null;el.classList.remove("on")}))}
hold($("#p4"),"eat");hold($("#wr"),"wr");hold($("#ch"),"ch");

// main.js — Точка входу: старт і цикл
function start(q){reset(q);G.run=true;$("#ov").hidden=true;beep(600,.1,"triangle",.06);toast("Дістань телефон 🎮🎵💬 — але стеж за вчителем!",2600)}
$("#go").onclick=()=>start(false);$("#go2").onclick=()=>start(true);
$("#ob").textContent=best?"Рекорд: "+fmt(best):"";
reset(false);hud();
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;if(G.run)update(dt);anim(dt);ren.render(scene,cam)}
requestAnimationFrame(loop);

})();</script></body></html>
